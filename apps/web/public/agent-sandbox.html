<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Isolated renderer for HTML/SVG/JS visuals written by the Agent. Loaded in <iframe sandbox="allow-scripts"> (opaque origin: no cookies, storage,
     parent DOM, forms, popups, downloads or navigation). The CSP below also blocks every network request and external file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<style>html,body{margin:0}body{padding:12px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#0f172a;background:#fff}</style>
</head>
<body>
<script>
(function () {
  var MAX = 60000;
  function report() {
    var h = Math.ceil(document.documentElement.scrollHeight);
    parent.postMessage({ type: 'agent-sandbox-height', h: h }, '*');
  }
  window.addEventListener('message', function (e) {
    if (e.source !== parent || !e.data || e.data.type !== 'render' || typeof e.data.html !== 'string' || e.data.html.length > MAX) return;
    var doc = new DOMParser().parseFromString(e.data.html, 'text/html');
    document.body.textContent = '';
    Array.prototype.forEach.call(doc.head.querySelectorAll('style'), function (s) { document.body.appendChild(s.cloneNode(true)); });
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) { document.body.appendChild(document.importNode(n, true)); });
    // nodes from DOMParser never run their scripts: re-create them so inline scripts execute (still under this page's CSP)
    Array.prototype.forEach.call(document.body.querySelectorAll('script'), function (old) {
      var s = document.createElement('script');
      s.text = old.text;
      old.parentNode.replaceChild(s, old);
    });
    report();
    setTimeout(report, 300);
  });
  new ResizeObserver(report).observe(document.body);
  parent.postMessage({ type: 'agent-sandbox-ready' }, '*');
})();
</script>
</body>
</html>
