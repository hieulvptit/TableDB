name: Build desktop package
description: Build and test a native Tauri package with a platform-specific JRE.
inputs:
  target:
    description: Rust target triple
    required: true
  bundles:
    description: Comma-separated Tauri bundle formats
    required: true
  artifact:
    description: Unique artifact name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: desktop-assets
        path: .
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/desktop/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri
        key: ${{ inputs.artifact }}
    - name: Install native Tauri CLI
      shell: bash
      working-directory: apps/desktop
      run: npm ci
    - name: Stage sidecar, create native JRE and configure Tauri
      shell: bash
      run: python .github/scripts/desktop-ci.py prepare
    - name: Rust unit tests
      shell: bash
      working-directory: apps/desktop/src-tauri
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: cargo test --locked --target "$BUILD_TARGET"
    - name: Build Tauri installer
      shell: bash
      working-directory: apps/desktop
      env:
        BUILD_TARGET: ${{ inputs.target }}
        BUILD_BUNDLES: ${{ inputs.bundles }}
        APPLE_SIGNING_IDENTITY: '-'
      run: |
        if [[ "$BUILD_TARGET" == *-linux-* && ",$BUILD_BUNDLES," == *,appimage,* ]]; then
          # linuxdeploy scans the bundled JRE; JNI libraries depend on libjvm.so
          # in lib/server, which is outside the system linker search path.
          JRE_LIB="$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/jre/lib"
          test -f "$JRE_LIB/server/libjvm.so"
          export LD_LIBRARY_PATH="$JRE_LIB/server:$JRE_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        fi
        npx --no-install tauri build --verbose --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --config "$GITHUB_WORKSPACE/apps/desktop/tauri.ci.json"
    - name: Verify bundled AppImage JRE and JDBC sidecar
      if: runner.os == 'Linux' && contains(inputs.bundles, 'appimage')
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: python .github/scripts/desktop-ci.py verify-appimage
    - name: Collect installers and SHA-256 checksums
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: python .github/scripts/desktop-ci.py collect
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: desktop-artifacts/
        if-no-files-found: error
        retention-days: 30
