name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'API origin (HTTPS or HTTP on a private IP); overrides TABLEDB_API_ORIGIN'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'services/jdbc/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'
      - '.github/actions/build-desktop/**'
      - '.github/scripts/desktop-ci.py'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'services/jdbc/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'
      - '.github/actions/build-desktop/**'
      - '.github/scripts/desktop-ci.py'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  API_ORIGIN: ${{ inputs.api_origin || vars.TABLEDB_API_ORIGIN || 'http://10.23.5.40:8484' }}

jobs:
  assets:
    name: Frontend and JDBC sidecar
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate API origin
        run: python3 .github/scripts/desktop-ci.py validate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build desktop frontend
        run: |
          npm ci
          npm run build:desktop --workspace @vnpay/web
      - name: Build and test JDBC sidecar
        run: mvn -B -ntp -f services/jdbc/pom.xml package
      - name: Download and verify pinned JDBC drivers
        run: bash services/jdbc/scripts/fetch-drivers.sh services/jdbc/target/drivers
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-assets
          path: |
            apps/web/dist/
            services/jdbc/target/tabledb-jdbc.jar
            services/jdbc/target/drivers/
          if-no-files-found: error
          retention-days: 7

  native:
    name: ${{ matrix.name }}
    needs: assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: tabledb-windows-x64
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: tabledb-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: tabledb-macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-desktop
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          artifact: ${{ matrix.artifact }}

  linux:
    name: ${{ matrix.name }}
    needs: assets
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x64 (DEB and AppImage)
            image: ubuntu:22.04
            bundles: deb,appimage
            artifact: tabledb-ubuntu-x64
          - name: Debian 12 x64 (DEB)
            image: debian:12
            bundles: deb
            artifact: tabledb-debian-x64
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install Linux build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git bash build-essential pkg-config \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 file wget xdg-utils python3 tar gzip unzip zip
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-desktop
        with:
          target: x86_64-unknown-linux-gnu
          bundles: ${{ matrix.bundles }}
          artifact: ${{ matrix.artifact }}
